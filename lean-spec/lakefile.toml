name = "OpenDistillationFactory"
# LupineEvidence is a default target so a plain `lake build` (and the full CI
# gate) re-verifies the generated evidence corpus on every commit.
defaultTargets = ["OpenDistillationFactory", "LupineEvidence"]

# ATLAS-Lean integration (Phase 1).
#
# We pin mathlib to ATLAS-Lean's exact revision so the whole dependency graph
# resolves to a SINGLE, reproducible mathlib. ATLAS (facebookresearch/atlas-lean)
# requires this same rev; matching it lets Lake dedupe mathlib and lets
# `lake exe cache get` pull prebuilt oleans instead of compiling from source.
# Toolchain is likewise aligned to ATLAS's v4.35.0 (see lean-toolchain).
# Ref: ATLAS_Lean_Integration_Review.md §4 (Integration Architecture), §7 (Risks).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# ATLAS-Lean (Meta), pinned to its current package layout.
# The upstream package is now named `atlas`. Its proved libraries are
# MathlibExt, CSLibExt, and PhyslibExt; WantedExt contains deferred results
# and must never enter our proof graph. Our default targets remain the two
# local libraries. Import only individual proved leaf modules when needed;
# never build the upstream default targets or whole subjects here.
[[require]]
name = "atlas"
git = "https://github.com/facebookresearch/atlas-lean"
rev = "a60759060b5616df0d5775b42da4d337719feb32"

[[lean_lib]]
name = "OpenDistillationFactory"

# LupineEvidence — generated evidence corpus (formalization ladder L1).
#
# Layout decision: a second lean_lib in THIS package (not a separate lake
# package). The generated modules are dependency-free (no Mathlib/Atlas
# imports), so `lake build LupineEvidence` compiles only the ~60 evidence
# modules against the toolchain's prebuilt Init — seconds, never Mathlib.
# Keeping one package avoids a second lakefile/manifest/toolchain to drift,
# and lets the Theory layer import evidence modules directly at rungs L2/L3.
#
# `LupineEvidence.lean` is the reviewed manifest (import list); the
# `LupineEvidence.+` glob additionally builds every .lean file in the tree so
# an unlisted (orphan) module still compiles instead of silently rotting.
# `scripts/check_evidence_manifest.sh` enforces manifest <-> tree bijection.
# Generators write here directly: see
# python/scripts/bind_y_matrix_references.py (--lean-dir default).
[[lean_lib]]
name = "LupineEvidence"
globs = ["LupineEvidence", "LupineEvidence.+"]
