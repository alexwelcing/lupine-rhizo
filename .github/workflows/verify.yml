name: Verify

# Focused, parallel pre-merge gates. This workflow is intentionally lightweight:
# no GPU, no cloud credentials, no heavy MLIP benchmarks. Heavy or optional work
# (CUDA benchmarks, Phoenix telemetry, Lean builds, full atlas-distill deploy)
# lives in separate workflows that are path-filtered or manually triggered.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-distill:
    name: Python Distill unit + compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and pytest
        run: pip install . pytest

      - name: Run unit tests
        run: python -m pytest -m unit -q

      - name: Compile all Python files
        run: find . -name '*.py' -print0 | xargs -0 python -m py_compile

  rust-engine:
    name: Rust engine check + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            atlas-distill/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('atlas-distill/Cargo.lock') }}

      - name: Cargo check workspace
        run: cargo check --workspace --manifest-path atlas-distill/Cargo.toml

      - name: Cargo test workspace
        run: cargo test --workspace --manifest-path atlas-distill/Cargo.toml

  tasks-consumer:
    name: Tasks consumer fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp/tasks-consumer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with formatting and lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --all-targets --all-features

  diff-hygiene:
    name: Diff whitespace hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          echo "Checking diff: ${base}...HEAD"
          git diff --check "${base}"...HEAD

  tools-smoke:
    name: Tools smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and pytest
        run: pip install ./python pytest

      - name: Run tool smoke tests
        run: |
          python -m pytest tools/test_mlip_regime_filter.py -q
          python -m pytest tools/test_mlip_local_promotion.py -q
          python -m pytest tools/test_mlip_phoenix_trace.py -q
          python -m pytest gcp/mlip-cell-runner/test_identity_args.py -q
          python -m pytest gcp/mlip-cell-runner/test_distill_runtime.py -q
          python -m pytest gcp/mlip-cell-runner/test_openinference_patcher.py -q
          python -m pytest gcp/mlip-cell-runner/test_runner_observability.py -q

  evidence-formal-bridge:
    name: Empirical-formal bridge artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and pytest
        run: pip install ./python pytest

      - name: Run evidence / claim / manifest / assumptions tests
        run: |
          python -m pytest \
            python/tests/test_evidence_bundle_schema.py \
            python/tests/test_claim_contract_schema.py \
            python/tests/test_campaign_manifest_schema.py \
            python/tests/test_round5_grouping.py \
            python/tests/test_assumptions_generator.py \
            python/tests/test_check_assumption_links.py \
            python/tests/test_ingest_campaign_results.py \
            python/tests/test_check_publication_claims.py \
            -q

      - name: Check generated assumption registry is up to date
        run: python tools/generate_assumptions.py --check

      - name: Check publication claims against active contracts
        run: python tools/check_publication_claims.py

  assumption-links:
    name: Assumption and theorem receipt links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check assumption links when formal or registry inputs change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            if git diff --quiet "${base}"...HEAD -- lean-spec/ registry/; then
              echo "No lean-spec/ or registry/ changes; assumption-link check not needed"
              exit 0
            fi
          fi
          python tools/check_assumption_links.py

  archive-boundary:
    name: Archive / active root boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce archive boundary
        run: python .github/scripts/archive_boundary_check.py
