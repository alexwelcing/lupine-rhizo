name: anti-laundering

on:
  pull_request:
    paths:
      - "registry/**"
      - "snapshots/**"
      - "evidence/**"
      - "registry/ontology/**"
      - "snapshots/ontology.lock.json"
      - "tools/check_ontology_links.py"
      - "tools/check_status_evidence.py"
      - "python/tests/test_check_ontology_links.py"
      - "python/tests/test_check_status_evidence.py"
      - ".github/workflows/anti-laundering.yml"

permissions:
  contents: read

jobs:
  status-requires-new-evidence:
    name: status changes require new EvidenceBundle hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install package and pytest
        run: pip install ./python pytest
      - name: Run checker tests
        run: >-
          python3 -m pytest
          python/tests/test_check_ontology_links.py
          python/tests/test_check_status_evidence.py
          -v
      - name: Validate versioned ontology links and lock
        run: python3 tools/check_ontology_links.py
      - name: Compare PR registry, ontology, and D1 status snapshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/check_status_evidence.py
          --base-ref "$BASE_SHA"
          --head-ref "$HEAD_SHA"
