name: distill CI / Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'distill/**'
      - 'lupine-ops/**'
      - '.github/workflows/build-distill.yml'
      - 'glim-think/src/workspace/candidateOrderContracts.ts'
      - 'glim-think/src/workspace/client/CandidateOrderReport.tsx'
      - 'glim-think/src/workspace/client/formatExactFraction.ts'
      - 'glim-think/scripts/testing/candidate-order-cli.test.mjs'
      - 'glim-think/scripts/testing/candidate-order-browser.test.mjs'
      - 'glim-think/package.json'
      - 'glim-think/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'distill/**'
      - 'lupine-ops/**'
      - '.github/workflows/build-distill.yml'
      - 'glim-think/src/workspace/candidateOrderContracts.ts'
      - 'glim-think/src/workspace/client/CandidateOrderReport.tsx'
      - 'glim-think/src/workspace/client/formatExactFraction.ts'
      - 'glim-think/scripts/testing/candidate-order-cli.test.mjs'
      - 'glim-think/scripts/testing/candidate-order-browser.test.mjs'
      - 'glim-think/package.json'
      - 'glim-think/package-lock.json'
  workflow_dispatch: {}

env:
  PROJECT_ID: shed-489901
  REGION: us-central1
  REPOSITORY: cloud-run-source-deploy
  SERVICE: atlas-distill

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distill
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            distill/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('distill/Cargo.lock') }}

      - name: Paradox smoke test
        run: cargo run --release --bin distill -- detect-paradox --bcc tests/fixtures/bcc_smoke.csv

      - name: Run tests
        run: cargo test --release -p lupine-distill --bin distill

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -p lupine-distill --bin distill -- -D warnings

      - name: Install Node for candidate report acceptance
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: glim-think/package-lock.json

      - name: Install locked report-reader dependencies
        working-directory: glim-think
        timeout-minutes: 3
        run: npm ci

      - name: Check public-source CLI reports through the application reader
        working-directory: glim-think
        timeout-minutes: 2
        run: DISTILL_BIN="$GITHUB_WORKSPACE/distill/target/release/distill" node --test --test-concurrency=1 scripts/testing/candidate-order-cli.test.mjs scripts/testing/candidate-order-browser.test.mjs

      - name: Generate docs
        run: cargo doc --no-deps -p lupine-distill --bin distill

  build-and-deploy:
    name: Build and Deploy
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          miss=0
          [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] && { echo "::error::MISSING SECRET: GCP_WORKLOAD_IDENTITY_PROVIDER"; miss=1; }
          [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ] && { echo "::error::MISSING SECRET: GCP_SERVICE_ACCOUNT"; miss=1; }
          exit $miss

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/atlas-distill:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/atlas-distill:latest \
            -f distill/Dockerfile \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/atlas-distill:${{ github.sha }}

      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs update ${{ env.SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/atlas-distill:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --service-account=atlas-distill-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars=DISTILL_INPUT_BUCKET=${{ env.PROJECT_ID }}-atlas-inputs,DISTILL_OUTPUT_BUCKET=${{ env.PROJECT_ID }}-atlas-outputs \
            --max-retries=3 \
            --memory=2Gi \
            --cpu=2 \
            --task-timeout=3600s

      - name: Verify deployment
        run: |
          gcloud run jobs describe ${{ env.SERVICE }} --region=${{ env.REGION }}
