name: lean-spec

# Formal verification gate. Heavy and cache-dependent, so it is path-filtered to
# lean-spec changes and manually triggered rather than running on every PR.

on:
  push:
    branches: [main]
    paths:
      - 'lean-spec/**'
      - 'config/lean_build_evidence.json'
      - 'tools/build_lean_evidence.py'
      - '.github/workflows/lean-spec.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lean-spec/**'
      # A manifest-only edit changes what the repo CLAIMS is proved without
      # touching a Lean file, so the old filter let it skip the formal gate
      # entirely. That is how the wrong-revision pin reached main.
      - 'config/lean_build_evidence.json'
      - 'tools/build_lean_evidence.py'
      - '.github/workflows/lean-spec.yml'
  workflow_dispatch:

concurrency:
  group: lean-spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build storage reserve
        shell: bash
        run: |
          free_kib=$(df -Pk . | awk 'NR == 2 { print $4 }')
          # 20 GiB reserve plus a bounded 20 GiB toolchain/cache/build budget.
          test "$free_kib" -ge 41943040 || {
            echo "Insufficient build storage: need 40 GiB free before setup."
            exit 1
          }

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake build
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lean-spec/.lake
            ~/.cache/lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-spec/lean-toolchain', 'lean-spec/lake-manifest.json') }}

      - name: Hydrate pinned mathlib cache
        working-directory: lean-spec
        run: lake exe cache get

      - name: Check pinned dependency resolution
        working-directory: lean-spec
        run: |
          lake env lean --version
          lake --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "56a005855ea17e0b0958f73ec801ae140b0a1679"
          test "$(git -C .lake/packages/atlas rev-parse HEAD)" = "a60759060b5616df0d5775b42da4d337719feb32"
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json

      - name: Check vacancy loss specification
        working-directory: lean-spec
        run: lake build OpenDistillationFactory.Materials.Theory.VacancyReference

      - name: Check anchored barrier specification
        working-directory: lean-spec
        run: lake build OpenDistillationFactory.Materials.Theory.UniversalCorrection.BarrierTransfer

      - name: lake build
        working-directory: lean-spec
        run: lake build

      - name: Check renamed data evidence modules
        working-directory: lean-spec
        run: |
          # Targeted rename verification; these remain outside the default roots.
          lake build OpenDistillationFactory.Materials.Data.Ni_EAM OpenDistillationFactory.Materials.Data.MPtrj_DFT

      - name: Check for sorries
        working-directory: lean-spec
        run: sh scripts/check_no_sorry.sh OpenDistillationFactory

      - name: Evidence manifest gate
        working-directory: lean-spec
        run: sh scripts/check_evidence_manifest.sh

      - name: Save reusable dependency and build cache
        if: ${{ !cancelled() && steps.lean-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            lean-spec/.lake
            ~/.cache/lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-spec/lean-toolchain', 'lean-spec/lake-manifest.json') }}
