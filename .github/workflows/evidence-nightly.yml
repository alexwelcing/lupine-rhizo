name: Evidence Index Nightly

# Nightly freshness + health for the evidence index:
#   1. collect live worker evidence + sync the deployed Library + drift +
#      site guides + Phoenix agent traces (each best-effort, never fails the job)
#   2. rebuild the index and its vec0/FTS5 sidecars
#   3. run the retrieval eval and publish the metrics + drift as artifacts
#
# The index itself is not committed (it is gitignored and rebuildable). The
# point is the SIGNAL: retrieval quality as a trend, and publication drift as
# a monitored value, both surfaced as downloadable artifacts and a job summary.
# Secrets are optional — steps that need them skip cleanly when absent.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC nightly (~midnight US Pacific)
  workflow_dispatch:
    inputs:
      staging_fixture:
        description: Run the complete ontology loop against checked-in staging data
        type: boolean
        default: false
      production_d1_maintenance:
        description: Apply production D1 migrations, seed reviewed hypotheses, and verify sign-skew
        type: boolean
        default: false

concurrency:
  group: evidence-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-production-cycle:
    name: publish dated production cycle
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cycle validation dependencies
        run: python -m pip install jsonschema rfc8785

      - name: Google Auth for production cycle
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: shed-489901

      - name: Validate and publish the dated production cycle
        run: |
          set -euo pipefail
          cycle_date="$(date -u -d yesterday +%F)"
          cycle_dir="nightly-input/$cycle_date"
          mkdir -p "$cycle_dir"
          cat > "$cycle_dir/cycle.json" <<'JSON'
          {
            "campaigns": [
              {
                "manifest": "../../campaigns/v1/z1.campaign-manifest.v1.json",
                "measurements": "../../data/candidates/z1/measurements.jsonl"
              }
            ]
          }
          JSON
          python tools/run_nightly_cycle.py \
            --cycle "$cycle_dir/cycle.json" \
            --output-dir production-cycle/validation
          gcloud storage cp "$cycle_dir/cycle.json" \
            "gs://shed-489901-atlas-outputs/evidence-nightly/$cycle_date/cycle.json"
          gcloud storage ls \
            "gs://shed-489901-atlas-outputs/evidence-nightly/$cycle_date/cycle.json"

  refresh-and-eval:
    name: refresh, reindex, eval
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.production_d1_maintenance }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cocoindex
    env:
      COCOINDEX_DB: .cocoindex/db
      WORKER_URL: https://glim-think-v1.aw-ab5.workers.dev
      EVIDENCE_EMBED_REPO: BAAI/bge-small-en-v1.5
      EVIDENCE_EMBED_REVISION: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      EVIDENCE_REQUIRE_REAL_EMBEDDINGS: '1'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_XET: '1'
      PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
      PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
      PHOENIX_PROJECT_NAME: ${{ secrets.PHOENIX_PROJECT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU-only torch first
        run: |
          # sentence-transformers pulls CUDA torch by default; install CPU-only
          # torch explicitly to stay within the GitHub runner disk quota.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pipeline
        run: pip install -e . pytest sqlite-vec

      - name: Cache pinned embedding model
        id: embedding-model-cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: bge-small-en-v1.5-${{ env.EVIDENCE_EMBED_REVISION }}

      - name: Materialize pinned embedding model
        if: steps.embedding-model-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["EVIDENCE_EMBED_REPO"],
              revision=os.environ["EVIDENCE_EMBED_REVISION"],
          )
          PY

      - name: Verify pinned embedding model is complete and offline-loadable
        run: |
          HF_HUB_OFFLINE=1 python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          from sentence_transformers import SentenceTransformer

          revision = os.environ["EVIDENCE_EMBED_REVISION"]
          model_path = snapshot_download(
              repo_id=os.environ["EVIDENCE_EMBED_REPO"],
              revision=revision,
              local_files_only=True,
          )
          if Path(model_path).name != revision:
              raise SystemExit("embedding cache did not resolve the pinned revision")
          model = SentenceTransformer(model_path, local_files_only=True)
          if model.get_sentence_embedding_dimension() != 384:
              raise SystemExit("pinned embedding model has unexpected dimension")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"EVIDENCE_EMBED_MODEL={model_path}\n")
          PY

      - name: Collect live worker evidence (best-effort)
        run: python ../scripts/evidence_activation.py collect --worker-url "$WORKER_URL" --out ./data || echo "::warning::worker collect failed; using existing/seed data"

      - name: Seed fallback if no ledger evidence
        run: test -f ./data/coordination_traces.jsonl || python seed_data.py

      - name: Unit tests (gate)
        run: python -m pytest test_pipeline.py -q

      - name: Sync deployed Library + publication drift (best-effort)
        run: python sync_ledger.py --drift || echo "::warning::ledger sync failed"

      - name: Fetch live site guides (best-effort)
        run: python fetch_site_content.py || echo "::warning::site-guide fetch failed"

      - name: Fetch Phoenix agent traces (best-effort; skips without secrets)
        run: python fetch_phoenix_traces.py || echo "::warning::phoenix fetch failed"

      - name: Build index + sidecars
        run: |
          mkdir -p .cocoindex
          python -m cocoindex.cli update main.py
          python build_vec_index.py

      - name: Retrieval eval
        run: |
          python eval_retrieval.py --json > eval_metrics.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("eval_metrics.json"))
          print(f"### Evidence index eval — {d['gold_queries']} gold queries, "
                f"real model: {d['real_embedding_model']}\n")
          print("| mode | hit@1 | hit@3 | hit@5 | MRR |")
          print("| --- | --- | --- | --- | --- |")
          for m, s in d["modes"].items():
              print(f"| {m} | {s['hit@1']:.2f} | {s['hit@3']:.2f} | "
                    f"{s['hit@5']:.2f} | {s['mrr']:.2f} |")
          PY

      - name: Publication drift to summary
        run: |
          if [ -f ./data/publication_drift.jsonl ]; then
            echo "### Publication drift" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; r=json.load(open('./data/publication_drift.jsonl')); print(r['text'])" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload metrics + drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-metrics
          path: |
            cocoindex/eval_metrics.json
            cocoindex/data/publication_drift.jsonl
          if-no-files-found: warn
          retention-days: 90

  ontology-feedback:
    name: ingest, gate, ontology feedback
    needs: publish-production-cycle
    if: >-
      ${{
        always()
        && (needs.publish-production-cycle.result == 'success'
            || needs.publish-production-cycle.result == 'skipped')
        && (github.event_name != 'workflow_dispatch'
            || !inputs.production_d1_maintenance)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CYCLE_DATE: ${{ github.event_name == 'workflow_dispatch' && '2026-08-01' || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install feedback dependencies
        run: python -m pip install jsonschema rfc8785

      - name: Google Auth for daily campaign rows
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.staging_fixture }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.staging_fixture }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: shed-489901

      - name: Select staging campaign rows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_fixture }}
        run: echo "CYCLE_FILE=python/tests/fixtures/nightly_cycle/cycle.json" >> "$GITHUB_ENV"

      - name: Download the dated production cycle
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.staging_fixture }}
        run: |
          cycle_date="$(date -u -d yesterday +%F)"
          echo "CYCLE_DATE=$cycle_date" >> "$GITHUB_ENV"
          mkdir -p nightly-input
          gcloud storage cp --recursive \
            "gs://shed-489901-atlas-outputs/evidence-nightly/$cycle_date" nightly-input/
          cycle_file="$(find nightly-input -name cycle.json -type f -print -quit)"
          test -n "$cycle_file"
          echo "CYCLE_FILE=$cycle_file" >> "$GITHUB_ENV"

      - name: Rehydrate durable ontology corpus
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.staging_fixture }}
        run: |
          state_uri="$(
            gcloud storage ls \
              'gs://shed-489901-atlas-outputs/evidence-nightly/ontology-state/*/corpus-*.tar.gz' \
              2>/dev/null | sort | tail -n 1 || true
          )"
          if [ -n "$state_uri" ]; then
            mkdir -p nightly-state/restored
            gcloud storage cp "$state_uri" nightly-state/corpus.tar.gz
            tar -xzf nightly-state/corpus.tar.gz -C nightly-state/restored \
              --no-same-owner --no-same-permissions
            test -d nightly-state/restored/registry/claims
            test -d nightly-state/restored/evidence/v1/examples
            # Merge, don't replace: the archive is the base state, but claims or
            # evidence merged into the default branch since the last archive
            # must survive (Codex P1 on PR #92). These dirs are append-only by
            # design, so an ignore-existing overlay is the correct union.
            rsync -a --ignore-existing nightly-state/restored/registry/claims/ registry/claims/
            rsync -a --ignore-existing nightly-state/restored/evidence/v1/examples/ evidence/v1/examples/
          fi

      - name: Ingest rows and regenerate assumptions plus runtime gate
        run: |
          python tools/run_nightly_cycle.py \
            --cycle "$CYCLE_FILE" \
            --output-dir nightly-output

      - name: Install D1 client
        working-directory: glim-think
        run: npm ci

      # This workflow's contract, stated in its own header, is that "secrets are
      # optional — steps that need them skip cleanly when absent". `test -n` under
      # `set -e` broke that contract: an absent secret hard-failed the job with no
      # message, so the nightly failed every scheduled run and its signal became
      # noise nobody read. An absent token now skips the remote-D1 steps and says
      # so. The repository's known placeholder is operationally equivalent to
      # an absent optional secret in the scheduled path, while malformed values
      # still fail loudly. Explicit production maintenance remains strict below.
      - name: Validate Cloudflare token secret
        id: cf_token
        shell: bash
        run: |
          set -uo pipefail
          token="${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; skipping remote D1 steps"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$token" = "-" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is a repository placeholder; skipping remote D1 steps"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$token" in
            *[[:space:]]*|Bearer*|CLOUDFLARE_API_TOKEN=*|\"*)
              echo "::error::CLOUDFLARE_API_TOKEN is malformed; refusing to rewrite credential bytes"
              exit 1
              ;;
          esac
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Seed local D1 fallback hypotheses
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.staging_fixture)
            || steps.cf_token.outputs.present != 'true'
          }}
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db = sqlite3.connect('nightly-output/staging.db')
          db.execute('PRAGMA foreign_keys = ON')
          for migration in sorted(Path('glim-think/migrations').glob('*.sql')):
              db.executescript(migration.read_text())
          for path in sorted(Path('examples/literature-hypotheses').glob('*.json')):
              contract = json.loads(path.read_text())
              db.execute(
                  'INSERT INTO literature_hypotheses (literature_hypothesis_id, contract_json) VALUES (?, ?)',
                  (f'lit-hypothesis.{path.stem}.v1', json.dumps(contract, separators=(',', ':'), sort_keys=True)),
              )
          path = Path('python/tests/fixtures/nightly_cycle/gap-hypothesis.json')
          contract = json.loads(path.read_text())
          db.execute(
              'INSERT INTO literature_hypotheses (literature_hypothesis_id, contract_json) VALUES (?, ?)',
              (f'lit-hypothesis.{path.stem}.v1', json.dumps(contract, separators=(',', ':'), sort_keys=True)),
          )
          rows = [
              {'literature_hypothesis_id': row[0], 'contract_json': row[1]}
              for row in db.execute(
                  'SELECT literature_hypothesis_id, contract_json FROM literature_hypotheses ORDER BY literature_hypothesis_id'
              )
          ]
          Path('nightly-output/hypotheses.json').write_text(json.dumps(rows, indent=2) + '\n')
          Path('nightly-output/known-bundles.json').write_text('[]\n')
          db.commit()
          PY

      - name: Migrate and export production D1 hypotheses
        if: ${{ steps.cf_token.outputs.present == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.staging_fixture) }}
        working-directory: glim-think
        run: |
          npx wrangler d1 migrations apply glim-ledger --remote
          python - <<'PY'
          import json
          from pathlib import Path
          statements = []
          for path in sorted(Path('../examples/literature-hypotheses').glob('*.json')):
              contract = json.loads(path.read_text())
              canonical = json.dumps(contract, separators=(',', ':'), sort_keys=True)
              statements.append(
                  "INSERT OR IGNORE INTO literature_hypotheses (literature_hypothesis_id, contract_json) "
                  f"VALUES ('lit-hypothesis.{path.stem}.v1', '{canonical.replace(chr(39), chr(39) * 2)}');"
              )
          Path('../nightly-output/seed-hypotheses.sql').write_text('\n'.join(statements) + '\n')
          PY
          npx wrangler d1 execute glim-ledger --remote --file ../nightly-output/seed-hypotheses.sql
          npx wrangler d1 execute glim-ledger --remote --json \
            --command "SELECT literature_hypothesis_id, contract_json FROM literature_hypotheses ORDER BY literature_hypothesis_id" \
            > ../nightly-output/hypotheses.json
          npx wrangler d1 execute glim-ledger --remote --json \
            --command "SELECT bundle_id FROM evidence_bundle ORDER BY bundle_id" \
            > ../nightly-output/known-bundles.json

      - name: Refresh ontology statuses and literature priority
        run: |
          python tools/nightly_ontology_feedback.py \
            --atlas registry/ontology/atlas.v2.json \
            --assumptions registry/assumptions.v1.json \
            --evidence-dir evidence/v1/examples \
            --hypotheses nightly-output/hypotheses.json \
            --new-bundle-ids nightly-output/sync-candidates.json \
            --known-bundle-ids nightly-output/known-bundles.json \
            --as-of "$CYCLE_DATE" \
            --out-sql nightly-output/feedback.sql \
            --out-queue nightly-output/literature-queue.json \
            --out-digest nightly-output/hermes-digest.md \
            --out-card nightly-output/hermes-digest-card.json

      - name: Apply feedback to staging D1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_fixture }}
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db = sqlite3.connect('nightly-output/staging.db')
          db.execute('PRAGMA foreign_keys = ON')
          db.executescript(Path('nightly-output/feedback.sql').read_text())
          evidence = {
              'hypotheses': db.execute(
                  'SELECT literature_hypothesis_id, status, readiness FROM literature_hypotheses ORDER BY literature_hypothesis_id'
              ).fetchall(),
              'queue': db.execute(
                  'SELECT chain_priority, chain_id, literature_hypothesis_id FROM literature_reprioritization_queue ORDER BY chain_priority, literature_hypothesis_id'
              ).fetchall(),
              'events': db.execute(
                  "SELECT entity_id, to_status, evidence_bundle_id FROM status_event WHERE entity_type = 'literature_hypothesis' ORDER BY entity_id"
              ).fetchall(),
          }
          Path('nightly-output/staging-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Persist durable ontology corpus
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.staging_fixture }}
        run: |
          archive="nightly-output/ontology-corpus.tar.gz"
          run_id="$(printf '%020d' "$GITHUB_RUN_ID")"
          run_attempt="$(printf '%04d' "$GITHUB_RUN_ATTEMPT")"
          tar -czf "$archive" registry/claims evidence/v1/examples
          gcloud storage cp "$archive" \
            "gs://shed-489901-atlas-outputs/evidence-nightly/ontology-state/$CYCLE_DATE/corpus-$run_id-$run_attempt.tar.gz"

      - name: Apply feedback to production D1
        if: ${{ steps.cf_token.outputs.present == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.staging_fixture) }}
        working-directory: glim-think
        run: npx wrangler d1 execute glim-ledger --remote --file ../nightly-output/feedback.sql

      - name: Publish Hermes digest to job summary
        if: always()
        run: test ! -f nightly-output/hermes-digest.md || cat nightly-output/hermes-digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nightly ontology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-feedback-${{ env.CYCLE_DATE }}
          path: |
            nightly-output/
            registry/assumptions.v1.json
            registry/claims/
            registry/snapshots/current.lock.json
            evidence/v1/examples/
          if-no-files-found: error
          retention-days: 90

  production-d1-maintenance:
    name: migrate, seed, verify production D1
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_d1_maintenance }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install D1 client
        working-directory: glim-think
        run: npm ci

      # Deliberately STRICTER than the same check in the nightly path above. This
      # job only runs when a human explicitly dispatches production D1
      # maintenance, so an absent token means the work they asked for cannot be
      # done — failing loudly is correct and skipping would be silent nonsense.
      # The nightly path skips instead, because there nobody asked for anything.
      - name: Validate Cloudflare token secret
        shell: bash
        run: |
          set -uo pipefail
          token="${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required for production D1 maintenance"
            exit 1
          fi
          if [ "$token" = "-" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is still the repository placeholder"
            exit 1
          fi
          case "$token" in
            *[[:space:]]*|Bearer*|CLOUDFLARE_API_TOKEN=*|\"*)
              echo "::error::CLOUDFLARE_API_TOKEN is malformed; refusing to rewrite credential bytes"
              exit 1
              ;;
          esac

      - name: Apply migrations and seed reviewed literature hypotheses
        working-directory: glim-think
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply glim-ledger --remote
          python - <<'PY'
          import json
          from pathlib import Path

          statements = []
          for path in sorted(Path('../examples/literature-hypotheses').glob('*.json')):
              contract = json.loads(path.read_text())
              canonical = json.dumps(contract, separators=(',', ':'), sort_keys=True)
              statements.append(
                  "INSERT INTO literature_hypotheses "
                  "(literature_hypothesis_id, contract_json) "
                  f"VALUES ('lit-hypothesis.{path.stem}.v1', "
                  f"'{canonical.replace(chr(39), chr(39) * 2)}') "
                  "ON CONFLICT(literature_hypothesis_id) DO UPDATE SET "
                  "contract_json = excluded.contract_json;"
              )
          Path('../seed-production-hypotheses.sql').write_text(
              '\n'.join(statements) + '\n', encoding='utf-8'
          )
          PY
          npx wrangler d1 execute glim-ledger --remote \
            --file ../seed-production-hypotheses.sql

      - name: Verify protocol-offset sign-skew in production D1
        working-directory: glim-think
        run: |
          set -euo pipefail
          npx wrangler d1 execute glim-ledger --remote --json \
            --command "SELECT literature_hypothesis_id, contract_json, status, readiness, proposed_experiment_predicate FROM literature_hypotheses WHERE literature_hypothesis_id = 'lit-hypothesis.protocol-offset-sign-skew.v1'" \
            > ../production-sign-skew-readback.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('../production-sign-skew-readback.json').read_text())
          rows = [row for result in payload for row in result.get('results', [])]
          expected_id = 'lit-hypothesis.protocol-offset-sign-skew.v1'
          if len(rows) != 1 or rows[0].get('literature_hypothesis_id') != expected_id:
              raise SystemExit(f'production D1 read-back failed: {rows!r}')
          expected_contract = json.loads(
              Path('../examples/literature-hypotheses/protocol-offset-sign-skew.json').read_text()
          )
          observed_contract = json.loads(rows[0].get('contract_json', 'null'))
          if observed_contract != expected_contract:
              raise SystemExit('production D1 sign-skew contract differs from reviewed source')
          for column, contract_key in (
              ('status', 'status'),
              ('readiness', 'readiness'),
          ):
              if rows[0].get(column) != expected_contract[contract_key]:
                  raise SystemExit(f'production D1 generated {column} does not match contract')
          expected_predicate = expected_contract['proposedExperiment']['predicate']
          if rows[0].get('proposed_experiment_predicate') != expected_predicate:
              raise SystemExit('production D1 generated predicate does not match contract')
          print(json.dumps(rows[0], sort_keys=True))
          PY
