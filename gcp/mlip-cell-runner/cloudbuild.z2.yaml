substitutions:
  _PROJECT_ID: shed-489901
  _REGION: us-central1
  _REPOSITORY: cloud-run-source-deploy
  _RUNNER_SA: atlas-distill-runner@shed-489901.iam.gserviceaccount.com
  _IMAGE_TAG: z2-soc-tc-v1
  _BACKEND: chgnet
  _JOB_NAME: mlip-cell-z2-chgnet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_JOB_NAME}:${_IMAGE_TAG}
      - --build-arg
      - BACKEND=${_BACKEND}
      - -f
      - gcp/mlip-cell-runner/Dockerfile.z2
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_JOB_NAME}:${_IMAGE_TAG}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE_URI="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_JOB_NAME}:${_IMAGE_TAG}"
        DIGEST="$(gcloud artifacts docker images describe "$${IMAGE_URI}" --format='value(image_summary.digest)')"
        if [[ ! "$${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Artifact Registry did not return an immutable sha256 digest" >&2
          exit 1
        fi
        gcloud run jobs deploy "${_JOB_NAME}" \
          --image=$${IMAGE_URI}@$${DIGEST} \
          --set-env-vars="RUNNER_IMAGE_DIGEST=$${DIGEST},RUNNER_IMAGE_URI=$${IMAGE_URI}@$${DIGEST}" \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --service-account="${_RUNNER_SA}" \
          --cpu=8 \
          --memory=32Gi \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=86400s

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_JOB_NAME}:${_IMAGE_TAG}
